services:
  frontend:
    environment:
      VITE_UI_LANGUAGE: he
    mem_limit: 768m
    cpus: 1.0
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
  backend:
    volumes:
      - ./local_repos:/local_repos:rw
    mem_limit: 768m
    cpus: 1.0
    command: ["sh", "-c", "npm run migrate && node src/server.js"]
  engine:
    restart: "no"
    mem_limit: 1g
    cpus: 1.0
  executor-view:
    mem_limit: 256m
    cpus: 0.5
  db:
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - openkritt-postgres:/var/lib/postgresql/data
volumes:
  openkritt-postgres:
