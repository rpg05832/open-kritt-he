# Hebrew distribution release: tests -> prebuilt images on ghcr.io -> GitHub release.
#
# Published images contain no proprietary CLI (Claude Code, Cursor, Grok) and no
# network certificate; those are installed/added on the user's machine. Every
# third-party action is pinned to a full commit SHA (release at least 14 days old).
#
# Trigger: push a tag "he-v<version>" (for example he-v1.4.1-1), run manually, or
# from the weekly maintenance workflow after its checks pass.
name: Hebrew release

on:
  push:
    tags: ['he-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example he-v1.4.1-1'
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      ref:
        description: Commit to release (the weekly workflow passes the tested commit)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: hebrew-release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  test:
    name: Tests and quality benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Frontend tests and lint
        working-directory: frontend
        run: npm ci && npx vitest run && npx eslint .
      - name: Build the engine image as published (no vendor CLIs)
        run: >-
          docker build --build-context vendor-cache=./vendor-cache
          --build-arg INCLUDE_VENDOR_CLIS=0 --build-arg INSTALL_CURSOR=0 --build-arg INSTALL_GROK=0
          -t engine-under-test engine
      - name: Engine tests and benchmark inside the image
        run: >-
          docker run --rm -v "$PWD:/src:ro" --entrypoint sh engine-under-test -c
          "cp -r /src /tmp/w && cd /tmp/w/engine && pip install -q pytest==8.3.3 &&
          python -m pytest -q -p no:cacheprovider && python tests/benchmark/run_benchmark.py"
      - name: Backend tests
        run: >-
          docker build --build-context vendor-cache=./vendor-cache --build-arg INCLUDE_VENDOR_CLIS=0
          -t backend-under-test backend &&
          docker run --rm -v "$PWD:/src:ro" --entrypoint sh backend-under-test -c
          "cp -r /src/backend/src /src/backend/test /app/ && cp -r /src/database / && cp -r /src/engine / &&
          mkdir -p /frontend && cp -r /src/frontend/src /frontend/ && cd /app && npm test"

  images:
    name: Image ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signature (Sigstore)
    strategy:
      matrix:
        service: [frontend, backend, engine, executor-view, db]
    outputs:
      frontend: ${{ steps.digest.outputs.frontend }}
      backend: ${{ steps.digest.outputs.backend }}
      engine: ${{ steps.digest.outputs.engine }}
      executor-view: ${{ steps.digest.outputs.executor-view }}
      db: ${{ steps.digest.outputs.db }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service == 'db' && 'database' || matrix.service }}
          build-contexts: vendor-cache=./vendor-cache
          build-args: |
            INCLUDE_VENDOR_CLIS=0
            INSTALL_CURSOR=0
            INSTALL_GROK=0
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/open-kritt-he-${{ matrix.service }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.description=Hebrew open-kritt (${{ matrix.service }}); third-party notices in /app/THIRD_PARTY_NOTICES.md of the release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        run: cosign sign --yes "${{ env.REGISTRY }}/open-kritt-he-${{ matrix.service }}@${{ steps.build.outputs.digest }}"
      - id: digest
        run: echo "${{ matrix.service }}=${{ env.REGISTRY }}/open-kritt-he-${{ matrix.service }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  release:
    name: Release files
    needs: images
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: images.json (image references pinned by digest)
        shell: pwsh
        run: |
          $images = [ordered]@{
            frontend = '${{ needs.images.outputs.frontend }}'; backend = '${{ needs.images.outputs.backend }}'
            engine = '${{ needs.images.outputs.engine }}'; 'executor-view' = '${{ needs.images.outputs.executor-view }}'
            db = '${{ needs.images.outputs.db }}'
          }
          foreach ($value in $images.Values) { if ($value -notmatch '@sha256:[a-f0-9]{64}$') { throw "missing digest: $value" } }
          @{ distribution = 'open-kritt-hebrew'; format = 2; version = $env:TAG; images = $images } |
            ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 legal/images.json
      - name: Install Inno Setup
        shell: pwsh
        # The hosted Windows runner may already ship a newer Inno Setup, which
        # makes a pinned `choco install` fail. Install the pin only when absent.
        run: |
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          if ($iscc | Where-Object { Test-Path $_ }) {
            Write-Host 'Inno Setup already present; using it.'
          } else {
            choco install innosetup --version 6.7.0 -y --no-progress
          }
      - name: Source package, Setup.exe and update package
        shell: pwsh
        run: |
          node legal/build-distribution.cjs "$PWD/../dist-out/release" --zip
          node legal/build-setup.cjs
          ./legal/test-distribution.ps1 -ReleaseRoot "$PWD/../dist-out/release" -SkipDocker
          node legal/build-update-package.cjs "$env:TAG" "$PWD/../dist-out"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: סריקת אבטחה ${{ env.TAG }}
          body: |
            הגרסה העברית, התוספות והשיפורים בוצעו על ידי @ארי ממתמחים טופ. מבוסס על open·kritt (AGPL-3.0).
            להתקנה: הורידו את SecurityScan-Setup והפעילו אותו. התקנה קיימת מתעדכנת אוטומטית ממסך התחזוקה.
            התמונות המוכנות נבנו ונבדקו כאן, נחתמו (Sigstore) וננעלו לפי טביעה ב־images.json.
          files: |
            ../dist-out/release.zip
            ../dist-out/release.zip.sha256
            ../distribution/SecurityScan-Setup-*.exe
            ../distribution/SecurityScan-Setup-*.exe.sha256
            ../dist-out/open-kritt-hebrew-update.zip
            ../dist-out/open-kritt-hebrew-update.json
            legal/images.json
